<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>타이 인터네이션 — 민트와 성조 공부</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&family=Noto+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f1ea;--card:#fff;--ink:#2a2420;--sub:#6b6058;--line:#e6ddd2;
  --mint:#1f9e89;--mint-d:#167a6a;--mint-l:#e3f4f0;--me:#fde7c8;--me-d:#b7791f;
  --t0:#64748b;--t1:#2563eb;--t2:#dc2626;--t3:#d97706;--t4:#16a34a;--tn:#8b8178;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;font-size:18px;line-height:1.55}
.th{font-family:'Leelawadee UI','Leelawadee','Noto Sans Thai',sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
.app{max-width:600px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.hidden{display:none!important}

/* ---------- home ---------- */
.home{padding:20px 16px 40px}
.hero{display:flex;gap:14px;align-items:center;background:var(--card);border-radius:20px;padding:16px;border:1px solid var(--line)}
.hero h1{margin:0;font-size:24px}
.hero p{margin:2px 0 0;color:var(--sub);font-size:16px}
.sect{margin-top:22px}
.sect h2{font-size:17px;color:var(--sub);margin:0 0 10px;font-weight:600}
.day{width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;display:flex;align-items:center;gap:14px}
.day:active{transform:scale(.99)}
.day .num{flex:none;width:52px;height:52px;border-radius:14px;background:var(--mint-l);color:var(--mint-d);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;line-height:1.1}
.day .num small{font-size:12px;font-weight:600}
.day .ttl{font-size:20px;font-weight:700}
.day .ttl .th{font-size:21px}
.day .desc{font-size:15px;color:var(--sub)}
.day .done{margin-left:auto;flex:none;font-size:14px;color:var(--mint-d);font-weight:700}
.opt{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:6px 16px}
.optrow{padding:12px 0;border-bottom:1px solid var(--line)}
.optrow:last-child{border-bottom:0}
.optrow .lbl{font-weight:600;margin-bottom:8px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:90px;border:1.5px solid var(--line);background:#fbf8f4;border-radius:12px;padding:10px 8px;font-size:16px}
.seg button.on{border-color:var(--mint);background:var(--mint-l);color:var(--mint-d);font-weight:700}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lg{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:15px}
.lg b{font-size:16px}
.note{font-size:15px;color:var(--sub);background:#fff8e6;border:1px solid #f1dfae;border-radius:12px;padding:10px 12px;margin-top:12px}

/* ---------- lesson ---------- */
.lesson{display:flex;flex-direction:column;height:100vh;height:100dvh}
.top{flex:none;display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--card);border-bottom:1px solid var(--line)}
.top .back{border:0;background:#f1ebe3;border-radius:12px;padding:8px 12px;font-size:16px}
.top .tt{flex:1;min-width:0}
.top .tt b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{height:6px;background:#eee5da;border-radius:6px;overflow:hidden;margin-top:4px}
.prog i{display:block;height:100%;background:var(--mint);width:0;transition:width .3s}
.top .mode{border:1.5px solid var(--mint);background:var(--mint-l);color:var(--mint-d);border-radius:12px;padding:6px 10px;font-size:15px;font-weight:700}
.log{flex:1;overflow-y:auto;padding:14px 12px 20px}
.row{display:flex;gap:8px;margin:10px 0;align-items:flex-end}
.row.me{justify-content:flex-end}
.av{flex:none;width:40px;height:40px}
.bub{max-width:85%;background:var(--card);border:1px solid var(--line);border-radius:18px 18px 18px 6px;padding:12px 14px}
.row.me .bub{background:var(--me);border-color:#f3d3a3;border-radius:18px 18px 6px 18px}
.bub .kr{font-size:19px}
.bub .bigth{font-size:25px;line-height:1.45}
.bub .smth{font-size:20px;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.bub .rom{font-size:16px;color:var(--sub)}
.bub .ko{font-size:17px;margin-top:4px}
.bub .say{border:0;background:none;padding:0;text-align:left}
.bub .say:after{content:" 🔊";font-size:15px}
.bub .reveal{margin-top:6px;border:1px solid var(--line);background:#fbf8f4;border-radius:10px;padding:4px 10px;font-size:15px}
.bub .ans{margin-top:6px;font-size:16px;color:var(--mint-d);font-weight:600}
.typing{display:inline-flex;gap:4px;padding:6px 2px}
.typing i{width:8px;height:8px;border-radius:50%;background:#c9bdb0;animation:b 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}

/* teach card */
.teach{background:var(--card);border:2px solid var(--mint);border-radius:20px;padding:14px;margin:12px 0}
.teach.me{border-color:var(--me-d)}
.teach .who{font-size:14px;font-weight:700;color:var(--mint-d);margin-bottom:6px}
.teach.me .who{color:var(--me-d)}
.trow{padding:10px 0;border-bottom:1px dashed var(--line)}
.trow:last-child{border-bottom:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:flex-end}
.chip{border:0;background:#faf6f1;border-radius:14px;padding:6px 8px 4px;display:flex;flex-direction:column;align-items:center;min-width:54px;border-bottom:4px solid var(--c,var(--tn))}
.chip:active{background:#efe6da}
.chip .ct{font-size:36px;line-height:1.35;color:var(--c,var(--ink))}
.chip .cr{font-size:15px;color:var(--ink)}
.chip .cn{font-size:12px;font-weight:700;color:var(--c,var(--tn))}
.chip svg{width:34px;height:16px;margin-top:1px}
.tmeta{display:flex;align-items:center;gap:8px;margin-top:8px}
.tmeta .m{flex:1;font-size:18px}
.tmeta .pl{flex:none;border:0;background:var(--mint-l);color:var(--mint-d);border-radius:12px;padding:6px 12px;font-size:15px;font-weight:700}
.teach.me .tmeta .pl{background:#fdf0dc;color:var(--me-d)}

/* quiz listen card */
.listen{background:var(--card);border:2px dashed var(--t3);border-radius:20px;padding:16px;margin:12px 0;text-align:center}
.listen .q{font-size:42px;color:var(--tn)}
.listen .big{border:0;background:#fff4e0;color:#9a5b06;border-radius:16px;padding:12px 20px;font-size:18px;font-weight:700}

/* bottom bar */
.bar{flex:none;background:var(--card);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
.bar .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bar .grid.one{grid-template-columns:1fr}
.bar .grid.three{grid-template-columns:1fr 1fr 1fr}
.btn{border:1.5px solid var(--line);background:#fbf8f4;border-radius:14px;padding:12px 8px;font-size:17px;line-height:1.3;min-height:54px}
.btn small{display:block;font-size:13px;color:var(--sub)}
.btn.pri{background:var(--mint);border-color:var(--mint);color:#fff;font-weight:700}
.btn.pri small{color:#d8f3ed}
.btn.reply{background:var(--me);border-color:#f3d3a3;text-align:left;padding:10px 14px}
.btn.reply .th{font-size:21px}
.btn.opt{font-size:18px}
.btn.opt .th{font-size:21px}
.btn.ok{background:#dcfce7;border-color:#16a34a}
.btn.bad{background:#fee2e2;border-color:#dc2626}
.btn:disabled{opacity:.55}
.mini{display:flex;gap:8px;margin-bottom:8px}
.mini button{flex:1;border:0;background:#f1ebe3;border-radius:12px;padding:8px;font-size:15px}
.mini button .th{font-size:17px}
.btn.mic{background:#fff1f2;border-color:#fb7185;color:#be123c;font-weight:700}
.btn.mic small{color:#be123c}
.btn.mic.rec{background:#e11d48;border-color:#e11d48;color:#fff;animation:pulse 1.2s infinite}
.btn.mic.rec small{color:#ffe4e6}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(225,29,72,.22)}}
.live{margin-top:8px;background:#fff7ed;border:1.5px dashed #fb923c;border-radius:12px;padding:8px 12px;font-size:21px;min-height:46px}
.live small{display:block;font-size:13px;color:#9a5b06;font-family:'Noto Sans KR',sans-serif}
.res .top2{display:flex;gap:12px;align-items:center;margin-bottom:6px}
.res .sc{font-size:36px;font-weight:800;line-height:1}
.res .sc small{font-size:14px;font-weight:600}
.res .sc.g{color:#16a34a}.res .sc.m{color:#d97706}.res .sc.b{color:#dc2626}
.res .hl{font-size:13px;color:#7a5a2a}
.res .heard{font-size:21px}
.res .chip{background:#fff;min-width:44px}
.res .chip .ct{font-size:26px}
.res .chip.hit{background:#dcfce7}
.res .chip.miss{background:#fee2e2}
.res .tip{font-size:14px;color:#7a5a2a;margin-top:4px}
.diag{font-size:15px;margin-top:10px;line-height:1.7}
.toast{position:fixed;left:50%;bottom:110px;transform:translate(-50%,30px);width:min(560px,92vw);background:#2a2420;color:#fff;border-radius:16px;padding:12px 14px;font-size:16px;opacity:0;pointer-events:none;transition:.25s;z-index:50}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{display:block;margin:8px 0 0 auto;border:0;background:#4b403a;color:#fff;border-radius:10px;padding:4px 12px;font-size:14px}
.end{text-align:center;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;margin:14px 0}
.end h3{margin:6px 0;font-size:22px}
</style>
</head>
<body>
<div class="app" id="app">

  <!-- HOME -->
  <div class="home" id="home">
    <div class="hero">
      <div id="heroAv"></div>
      <div>
        <h1><span class="th">มิ้นท์</span> (민트)</h1><div style="font-size:14px;color:var(--mint-d);font-weight:700">타이 인터네이션</div>
        <p>한국말 조금 하는 방콕 친구. 천천히 같이 성조 공부해요.</p>
      </div>
    </div>

    <div class="sect">
      <h2>소리 확인</h2>
      <div class="opt" style="padding:12px 16px">
        <button class="btn pri" id="testBtn" style="width:100%">🔊 소리 테스트 · 먼저 눌러 보세요</button>
        <div class="diag" id="diag"></div>
        <div class="hidden" id="diagAsk" style="font-size:15px;margin-top:8px;color:var(--sub)">
          소리가 안 들리면: ① 휴대폰 <b>미디어 볼륨</b>을 올려요 ② Claude 앱 안이라면 링크를 <b>크롬 브라우저</b>로 열어요 ③ 아래 설정에서 "소리 엔진"을 바꿔 봐요
        </div>
      </div>
    </div>

    <div class="sect">
      <h2>오늘 공부</h2>
      <div id="dayList"></div>
    </div>

    <div class="sect">
      <h2>설정</h2>
      <div class="opt">
        <div class="optrow">
          <div class="lbl">민트의 말투</div>
          <div class="seg" data-key="mode">
            <button data-v="kr">한국말 섞어서</button>
            <button data-v="th"><span class="th">ภาษาไทย</span>로만</button>
          </div>
        </div>
        <div class="optrow">
          <div class="lbl">태국어 말 빠르기</div>
          <div class="seg" data-key="rate">
            <button data-v="0.45">아주 천천히</button>
            <button data-v="0.6">천천히</button>
            <button data-v="0.8">보통</button>
          </div>
        </div>
        <div class="optrow">
          <div class="lbl">한국어 뜻</div>
          <div class="seg" data-key="meaning">
            <button data-v="show">바로 보기</button>
            <button data-v="tap">눌러서 보기</button>
          </div>
        </div>
        <div class="optrow" id="engRow">
          <div class="lbl">소리 엔진</div>
          <div class="seg" data-key="engine">
            <button data-v="auto">자동</button>
            <button data-v="web">휴대폰 음성</button>
            <button data-v="claude">Claude 음성</button>
          </div>
        </div>
        <div class="optrow">
          <div class="lbl">민트가 소리 내서 말하기</div>
          <div class="seg" data-key="auto">
            <button data-v="on">켜기</button>
            <button data-v="off">끄기</button>
          </div>
        </div>
      </div>
      <div class="note hidden" id="voiceNote"></div>
      <div class="note" id="micNote">🎤 마이크(발음 채점) 확인 중…</div>
    </div>

    <div class="sect">
      <h2>성조 색깔 보는 법</h2>
      <div class="legend" id="legend"></div>
      <div class="note">글자 아래 색깔 줄과 선 모양이 성조예요. 글자 하나를 누르면 그 소리만 들려요.</div>
    </div>
  </div>

  <!-- LESSON -->
  <div class="lesson hidden" id="lesson">
    <div class="top">
      <button class="back" id="backBtn">← 처음</button>
      <div class="tt"><b id="lsTitle"></b><div class="prog"><i id="progBar"></i></div></div>
      <button class="mode" id="modeBtn"></button>
    </div>
    <div class="log" id="log"></div>
    <div class="bar" id="bar"></div>
  </div>
</div>

<script src="capacitor.js"></script>
<script>
/* ================= data ================= */
const TN=[
  {th:'สามัญ',ko:'평성',c:'--t0'},
  {th:'เอก',ko:'1성',c:'--t1'},
  {th:'โท',ko:'2성',c:'--t2'},
  {th:'ตรี',ko:'3성',c:'--t3'},
  {th:'จัตวา',ko:'4성',c:'--t4'}
];
const TDESC=['가운데 평평하게','낮게','올라갔다 뚝 떨어짐','높게','내려갔다 쭉 올라감'];
const PATHS=['M3 9 L31 9','M3 11 L31 14','M3 7 Q12 1 31 14','M3 6 Q18 5 31 2','M3 10 Q14 16 31 2'];

// "ไม้|máai|3 ใหม่|mài|1" -> syllables ; tone "-" = no single tone
function S(str){return str.trim().split(/\s+/).map(p=>{const [t,r,n]=p.split('|');return {t,r,n:(n==='-'||n===undefined)?null:+n}})}
const txt=s=>s.map(x=>x.t).join('');

const PRAISE_REPEAT=[
  {th:'เก่งมากค่ะ',rom:'kèng mâak khâ',ko:'잘했어요',kr:'잘했어요! 발음 좋아요.'},
  {th:'ดีมากเลยค่ะ',rom:'dii mâak loei khâ',ko:'아주 좋아요',kr:'아주 좋아요~ 태국 사람 같아요, 헤헤.'},
  {th:'ชัดมากค่ะ',rom:'chát mâak khâ',ko:'발음이 또렷해요',kr:'발음 깨끗해요!'}
];
const PRAISE_QUIZ=[
  {th:'ถูกต้องค่ะ เก่งมาก',rom:'thùuk-tɔ̂ng khâ, kèng mâak',ko:'정답이에요, 잘했어요!',kr:'정답! 피 귀가 좋네요~'},
  {th:'ใช่แล้วค่ะ',rom:'châi lɛ́ɛo khâ',ko:'맞아요',kr:'맞아요! 완벽해요.'},
  {th:'เยี่ยมเลยค่ะ',rom:'yîam loei khâ',ko:'훌륭해요',kr:'와, 최고예요!'}
];
const WRONG={th:'ไม่เป็นไรค่ะ ฟังอีกทีนะคะ',rom:'mâi-pen-rai khâ, fang ìik thii ná khá',ko:'괜찮아요, 한 번 더 들어 봐요.',kr:'괜찮아요~ 틀려도 돼요. 한 번 더 들어 봐요.'};
const HARD={th:'ไม่เป็นไรค่ะ ฟังช้าๆ ทีละพยางค์นะคะ',rom:'mâi-pen-rai khâ, fang cháa-cháa thii-lá pha-yaang ná khá',ko:'괜찮아요, 한 글자씩 천천히 들어 봐요.',kr:'괜찮아요~ 어려운 거 맞아요. 한 글자씩 천천히 다시 해요.'};

const TONE_Q={th:'เสียงอะไรคะ',rom:'sǐang à-rai khá',ko:'무슨 성조예요?',kr:'잘 들어요… 이거 몇 성이에요?'};
const MEAN_Q={th:'คำนี้แปลว่าอะไรคะ',rom:'kham níi plɛɛ wâa à-rai khá',ko:'이 말은 무슨 뜻이에요?',kr:'잘 들어요… 이거 무슨 뜻이에요?'};

const DAYS=[
{
  id:'d1', title:'เสียงวรรณยุกต์ 5 เสียง', ko:'성조 다섯 개 이름 배우기',
  steps:[
    {k:'say',th:'สวัสดีค่ะพี่',rom:'sà-wàt-dii khâ phîi',ko:'안녕하세요, 피(형)!',kr:'피~ 안녕하세요! 나 민트예요. 한국말 조금 해요, 헤헤.',
      replies:[{th:'สวัสดีครับ',rom:'sà-wàt-dii khráp',ko:'안녕하세요'}]},
    {k:'say',th:'หนูชื่อมิ้นท์ค่ะ เป็นคนกรุงเทพฯ',rom:'nǔu chʉ̂ʉ mín khâ, pen khon krung-thêep',ko:'제 이름은 민트예요. 방콕 사람이에요.',kr:'나는 방콕 사람이에요. 피 태국말 공부하죠? 내가 도와줄게요!'},
    {k:'say',th:'วันนี้เราเรียนเสียงวรรณยุกต์กันนะคะ',rom:'wan-níi rao rian sǐang wan-ná-yúk kan ná khá',ko:'오늘은 같이 성조를 배워요.',kr:'오늘은 성조 공부! 태국말로 \'씨앙 완나윳\'이라고 해요.'},
    {k:'teach',who:'friend',rows:[{s:S('เสียง|sǐang|4 วรรณยุกต์|wan-ná-yúk|-'),ko:'성조 (เสียง = 소리)'}]},
    {k:'say',th:'ภาษาไทยมีห้าเสียงค่ะ',rom:'phaa-sǎa thai mii hâa sǐang khâ',ko:'태국어는 성조가 다섯 개예요.',kr:'태국말 성조는 다섯 개! 하나씩 천천히 해요.'},

    {k:'say',th:'เสียงที่หนึ่ง เสียงสามัญค่ะ',rom:'sǐang thîi nʉ̀ng, sǐang sǎa-man khâ',ko:'첫 번째, 평성이에요.',kr:'첫 번째는 \'씨앙 싸-만\', 평성이에요. 평평하게~ 올라가지도 내려가지도 않아요.'},

const DEF={mode:'kr',rate:'0.6',meaning:'show',auto:'on',engine:'auto'};
let set=Object.assign({},DEF), done={};
try{Object.assign(set,JSON.parse(localStorage.getItem('mint_set')||'{}'))}catch(e){}
try{done=JSON.parse(localStorage.getItem('mint_done')||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem('mint_set',JSON.stringify(set));localStorage.setItem('mint_done',JSON.stringify(done))}catch(e){}};

/* ================= speech ================= */
let voices=[];
function loadV(){try{voices=speechSynthesis.getVoices()||[]}catch(e){voices=[]}}
if('speechSynthesis' in window){loadV();try{speechSynthesis.onvoiceschanged=()=>{loadV();try{updDiag()}catch(e){}}}catch(e){}}
function pick(lang){
  const l=lang.toLowerCase();
  return voices.find(v=>v.lang&&v.lang.toLowerCase().replace('_','-')===l)||voices.find(v=>v.lang&&v.lang.toLowerCase().startsWith(l.slice(0,2)));
}
/* ===== 안드로이드 앱(APK)일 때: 민트 플러그인 ===== */
const NATIVE=!!(window.Capacitor&&typeof Capacitor.isNativePlatform==='function'&&Capacitor.isNativePlatform());
let Mint=null, nInfo=null, nPending=null;
if(NATIVE){try{Mint=Capacitor.registerPlugin('Mint')}catch(e){Mint=null}}
function nRefresh(){if(!Mint)return Promise.resolve();return Mint.info().then(i=>{nInfo=i;try{updDiag()}catch(e){}}).catch(()=>{})}
if(Mint){
  try{Mint.addListener('ttsReady',e=>{nRefresh();if(e&&e.ready&&nPending){const l=nPending;nPending=null;speakNative(l)}})}catch(e){}
  setTimeout(nRefresh,300);setTimeout(nRefresh,2000);
}
function speakNative(list){
  speakSeq++;
  Mint.speak({items:list.map(o=>({text:o.text,lang:o.lang,rate:o.rate,pitch:1.05}))}).then(()=>{
    if(nInfo&&nInfo.ttsReady&&nInfo.thai===false&&list.some(o=>o.lang.startsWith('th')))soundMsg('nothai');
  }).catch(err=>{
    const m=String((err&&err.message)||err||'');
    if(/tts_not_ready/.test(m)){nPending=list;nRefresh()}
    else soundMsg('claudeerr');
  });
}
function makeNativeDict(M){
  let st='idle';const P=[],F=[],S=[];
  const emit=(s,r)=>{st=s;S.forEach(h=>{try{h({state:s,reason:r})}catch(e){}})};
  M.addListener('listen',e=>{if(st==='idle')return;if(e.state==='listening')emit('listening');else if(e.state==='finishing'&&st==='listening')emit('finishing')});
  M.addListener('partial',e=>{if(st!=='idle')P.forEach(h=>h({text:e.text||''}))});
  M.addListener('result',e=>{if(st==='idle')return;const t=(e.texts&&e.texts[0])||'';P.forEach(h=>h({text:''}));F.forEach(h=>h({text:t}));emit('idle','stopped')});
  M.addListener('listenError',e=>{if(st==='idle')return;const c=+e.code;
    if(c===6||c===7)emit('idle','stopped');            // 말이 없거나 못 알아들음 → 빈 결과
    else if(c===9)emit('idle','not_granted');           // 권한 없음
    else if(c===12||c===13)emit('idle','unavailable');  // 태국어 인식 미지원
    else emit('idle','upstream_error')});
  return{
    start(){if(st!=='idle')return Promise.resolve();emit('starting');
      return M.listen({lang:'th-TH'}).then(()=>{}).catch(err=>{const m=String((err&&err.message)||err||'');
        const code=/not_granted/.test(m)?'not_granted':/unavailable/.test(m)?'unavailable':'upstream_error';
        emit('idle',code);return Promise.reject({code,message:m})})},
    stop(){if(st==='idle')return Promise.resolve();return M.stopListen().then(()=>{}).catch(()=>{})},
    active(){return st!=='idle'},
    onPartial(h){P.push(h);return()=>{}},onFinal(h){F.push(h);return()=>{}},onState(h){S.push(h);return()=>{}}
  };
}

/* 두 가지 소리: ① 휴대폰(브라우저) 음성  ② Claude 음성(tts) — 안 되면 자동으로 바꿈 */
let TTS=null, ttsChecked=false, webOK=null, speakSeq=0;
const keepU=[];
const hasWeb=()=>('speechSynthesis' in window)&&typeof SpeechSynthesisUtterance!=='undefined';
function engine(){
  if(NATIVE&&Mint)return 'native';
  if(set.engine==='claude'&&TTS)return 'claude';
  if(set.engine==='web')return hasWeb()?'web':(TTS?'claude':'none');
  if(!hasWeb())return TTS?'claude':'none';
  if(webOK===false&&TTS)return 'claude';
  loadV();
  if(voices.length&&!pick('th-TH')&&TTS)return 'claude';
  return 'web';
}
function speak(list){
  list=(list||[]).filter(o=>o&&o.text);
  if(!list.length)return;
  const e=engine();
  if(e==='native')return speakNative(list);
  if(e==='claude')return speakClaude(list);
  if(e==='web')return speakWeb(list);
  soundMsg('none');
}
function stopSound(){
  speakSeq++;
  if(Mint){try{Mint.stop().catch(()=>{})}catch(e){}return}
  try{if(hasWeb())speechSynthesis.cancel()}catch(e){}
  try{if(TTS&&TTS.active())TTS.stop().catch(()=>{})}catch(e){}
}
function speakWeb(list){
  const ss=window.speechSynthesis;
  const my=++speakSeq;
  try{if(TTS&&TTS.active())TTS.stop().catch(()=>{})}catch(e){}
  let started=false;
  const go=()=>{
    if(my!==speakSeq)return;
    keepU.length=0;
    list.forEach(o=>{
      const u=new SpeechSynthesisUtterance(o.text);
      u.lang=o.lang;const v=pick(o.lang);if(v)u.voice=v;
      u.rate=o.rate;u.pitch=1.08;u.volume=1;
      u.onstart=()=>{started=true;webOK=true;updDiag()};
      u.onerror=ev=>{const er=ev&&ev.error;if(er==='interrupted'||er==='canceled')return;if(!started&&my===speakSeq)webFail(list)};
      keepU.push(u);
      try{ss.speak(u)}catch(err){webFail(list)}
    });
    try{ss.resume()}catch(e){}
    if(webOK!==true)setTimeout(()=>{if(my===speakSeq&&!started&&webOK!==true)webFail(list)},3000);
  };
  try{if(ss.speaking||ss.pending){ss.cancel();setTimeout(go,180)}else go()}catch(e){webFail(list)}
}
function webFail(list){
  if(webOK===false)return;
  webOK=false;updDiag();
  if(TTS){speakClaude(list);soundMsg('switched')}
  else soundMsg('webfail');
}
const cRate=r=>r<=0.5?0.7:r<=0.65?0.75:r<=0.85?0.9:1;
function speakClaude(list){
  if(!TTS){soundMsg('none');return}
  speakSeq++;
  try{if(hasWeb())speechSynthesis.cancel()}catch(e){}
  const lines=list.map(o=>({text:o.text,language:o.lang.slice(0,2),rate:o.lang.startsWith('th')?cRate(o.rate):1}));
  TTS.speak(lines).catch(err=>{
    const c=err&&err.code;
    if(c==='stopped'||c==='busy'||c==='no_gesture')return;
    if(c==='not_granted'||c==='unavailable'){TTS=null;updDiag();soundMsg('claudeoff')}
    else if(c==='rate_limited')soundMsg('rate');
    else soundMsg('claudeerr');
  });
}

const norm=s=>String(s).replace(/[\s.,!?ฯ…"'()\-–—:;]/g,'');
function lev(a,b){
  a=[...a];b=[...b];
  const d=Array.from({length:a.length+1},(_,i)=>[i]);
  for(let j=1;j<=b.length;j++)d[0][j]=j;
  for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)
    d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return d[a.length][b.length];
}
function sim(a,b){const m=Math.max([...a].length,[...b].length);return m?Math.max(0,Math.round(100*(1-lev(a,b)/m))):0}
function gradeNow(){
  const ctx=micCtx;if(!ctx)return;
  const raw=(heard+heardPart).trim();heard='';heardPart='';
  const lv=$('live');if(lv)lv.classList.add('hidden');
  const said=norm(raw);
  if(!said){addFriend(NOHEAR);ctx.redraw();return}
  const rows=ctx.st.rows;
  const cands=rows.map(r=>({s:r.s,t:norm(txt(r.s))}));
  if(rows.length>1)cands.push({s:rows.flatMap(r=>r.s),t:norm(rows.map(r=>txt(r.s)).join(''))});
  let best=null;
  cands.forEach(c=>{const sc=sim(said,c.t);if(!best||sc>best.sc)best={...c,sc}});
  const marks=best.s.map(x=>said.includes(norm(x.t)));
  const cls=best.sc>=90?'g':best.sc>=70?'m':'b';
  const chips=best.s.map((x,k)=>chipHTML(x).replace('class="chip"',`class="chip ${marks[k]?'hit':'miss'}"`)).join('');
  const r=el('div','row me');
  const b=el('div','bub res',`<div class="top2"><div class="sc ${cls}">${best.sc}<small>점</small></div>
    <div><div class="hl">민트가 들은 말</div><div class="heard th">${esc(raw)}</div></div></div>
    <div class="chips">${chips}</div>
    <div class="tip">초록 = 잘 들렸어요 · 빨강 = 다르게 들렸어요 (글자를 누르면 바른 소리)</div>`);
  b.querySelectorAll('.chip').forEach(c=>c.onclick=ev=>{ev.stopPropagation();speak([TH(c.dataset.t,true)])});
  r.appendChild(b);$('log').appendChild(r);scrollEnd();
  L.pron.push(best.sc);
  ctx.graded=true;
  const m=REACT.find(x=>best.sc>=x.min).m;
  const fr=friendRow(m);$('log').appendChild(fr);scrollEnd();
  const S2=[];
  if(set.auto==='on'){if(set.mode==='kr')S2.push(KO(m.kr));S2.push(TH(m.th))}
  if(best.sc<90){const miss=best.s.filter((x,k)=>!marks[k]);(miss.length?miss:best.s).forEach(x=>S2.push(TH(x.t,true)))}
  speak(S2);
  ctx.redraw();
}

/* ================= lesson engine ================= */
let L=null; // {day, i, score, total}
function startDay(i){
  stopMic();
  L={day:DAYS[i],di:i,i:-1,score:0,total:0,pron:[]};
  $('home').classList.add('hidden');$('lesson').classList.remove('hidden');
  $('lsTitle').innerHTML=`DAY ${i+1} · <span class="th">${L.day.title}</span>`;
  $('log').innerHTML='';
  updModeBtn();
  next();
}
function goHome(){stopMic();stopSound();
  $('lesson').classList.add('hidden');$('home').classList.remove('hidden');renderHome();window.scrollTo(0,0)}
$('backBtn').onclick=goHome;
function updModeBtn(){$('modeBtn').innerHTML=set.mode==='kr'?'한+ไทย':'<span class="th">ไทย</span>만'}
$('modeBtn').onclick=()=>{set.mode=set.mode==='kr'?'th':'kr';save();updModeBtn();
  const last=[...$('log').querySelectorAll('.row.f')].pop();
  if(last&&last._m)last.replaceWith(friendRow(last._m,true));
};
function scrollEnd(){const lg=$('log');requestAnimationFrame(()=>lg.scrollTop=lg.scrollHeight)}
function prog(){$('progBar').style.width=Math.round(((L.i+1)/L.day.steps.length)*100)+'%'}

function friendRow(m,noAnim,extra){
  const r=el('div','row f');r._m=m;
  r.insertAdjacentHTML('beforeend',avatar(40));
  const b=el('div','bub');
  if(set.mode==='kr'&&m.kr){
    b.innerHTML=`<div class="kr">${esc(m.kr)}</div>`+(m.th?`<div class="smth"><button class="say th">${esc(m.th)}</button><div class="rom">${esc(m.rom)}</div></div>`:'');
  }else{
    const showKo=set.meaning==='show';
    b.innerHTML=`<button class="say bigth th">${esc(m.th)}</button><div class="rom">${esc(m.rom)}</div>`+
      (showKo?`<div class="ko">${esc(m.ko)}</div>`:`<button class="reveal">뜻 보기</button><div class="ko hidden">${esc(m.ko)}</div>`);
  }
  if(extra)b.insertAdjacentHTML('beforeend',extra);
  b.querySelectorAll('.say').forEach(s=>s.onclick=()=>speak([TH(m.th)]));
  const rv=b.querySelector('.reveal');if(rv)rv.onclick=()=>{rv.remove();b.querySelector('.ko').classList.remove('hidden')};
  r.appendChild(b);
  return r;
}
function addFriend(m,extra,opts){
  const lg=$('log');
  const r=friendRow(m,false,extra);
  lg.appendChild(r);scrollEnd();
  sayFriend(m,opts);
}
function addMe(html,thText){
  const r=el('div','row me');
  const b=el('div','bub',html);
  if(thText)b.onclick=()=>speak([TH(thText)]);
  r.appendChild(b);$('log').appendChild(r);scrollEnd();
}
function bar(html,cls){const b=$('bar');b.innerHTML=html;return b}

function replayRow(){ // mini row: again / slowly for last friend line
  return `<div class="mini"><button id="again"><span class="th">อีกที</span> · 한 번 더</button><button id="slow"><span class="th">ช้าๆ</span> · 더 천천히</button></div>`;
}
function wireReplay(m){
  const a=$('again'),s=$('slow');
  if(a)a.onclick=()=>speak([TH(m.th)]);
  if(s)s.onclick=()=>speak([TH(m.th,true)]);
}

function stopMic(){micCtx=null;try{if(DICT&&DICT.active())DICT.stop().catch(()=>{})}catch(e){}}
function next(){
  stopMic();
  L.i++;prog();
  const st=L.day.steps[L.i];
  if(!st){return finish()}
  if(st.k==='say')return doSay(st);
  if(st.k==='teach')return doTeach(st);
  if(st.k==='quiz')return doQuiz(st);
}

function nextBar(m){
  bar(`${m&&m.th?replayRow():''}<div class="grid one"><button class="btn pri" id="nx"><span class="th">ต่อไป</span> · 다음 ▶</button></div>`);
  if(m&&m.th)wireReplay(m);
  $('nx').onclick=next;
}

function doSay(st){
  addFriend(st);
  if(st.replies){
    bar(replayRow()+'<div class="grid one">'+st.replies.map((r,j)=>
      `<button class="btn reply" data-j="${j}"><span class="th">${esc(r.th)}</span><small>${esc(r.rom)} · ${esc(r.ko)}</small></button>`).join('')+'</div>');
    wireReplay(st);
    $('bar').querySelectorAll('.reply').forEach(b=>b.onclick=()=>{
      const r=st.replies[+b.dataset.j];
      addMe(`<div class="th" style="font-size:22px">${esc(r.th)}</div><div class="rom" style="font-size:15px;color:#7a5a2a">${esc(r.rom)}</div>`,r.th);
      if(r.resp){addFriend(r.resp);nextBar(r.resp)}
      else{speak([TH(r.th)]);nextBar(null)}
    });
  }else nextBar(st);
}

function doTeach(st){
  const lg=$('log');
  const card=el('div','teach'+(st.who==='me'?' me':''));
  card.innerHTML=`<div class="who">${st.who==='me'?'피가 말할 문장 · <span class="th">พี่พูดแบบนี้</span>':'민트가 알려 주는 말 · <span class="th">ฟังนะคะ</span>'}</div>`+
    st.rows.map((r,j)=>`<div class="trow"><div class="chips">${r.s.map(chipHTML).join('')}</div>
      <div class="tmeta"><div class="m">${set.meaning==='show'?esc(r.ko):`<button class="reveal" style="border:1px solid var(--line);background:#fbf8f4;border-radius:10px;padding:4px 10px;font-size:15px">뜻 보기</button><span class="hidden">${esc(r.ko)}</span>`}</div>
      <button class="pl" data-j="${j}">▶ 듣기</button></div></div>`).join('');
  card.querySelectorAll('.chip').forEach(c=>c.onclick=()=>speak([TH(c.dataset.t,true)]));
  card.querySelectorAll('.pl').forEach(p=>p.onclick=()=>speak([TH(txt(st.rows[+p.dataset.j].s))]));
  card.querySelectorAll('.reveal').forEach(rv=>rv.onclick=()=>{rv.nextElementSibling.classList.remove('hidden');rv.remove()});
  lg.appendChild(card);scrollEnd();

  const playAll=()=>speak(st.chant?st.rows[0].s.map(x=>TH(x.t)):st.rows.map(r=>TH(txt(r.s))));
  const playSyl=()=>{const L2=[];st.rows.forEach(r=>r.s.forEach(x=>L2.push(TH(x.t,true))));speak(L2)};
  if(set.auto==='on')playAll();

  const ctx={st,graded:false,wasListening:false};
  micCtx=ctx;
  const hard=()=>{
    addMe(`어려워요… <span class="th">ยากจังครับ</span>`);
    const r=friendRow(HARD);$('log').appendChild(r);scrollEnd();
    const L2=[];
    if(set.auto==='on'&&set.mode==='kr')L2.push(KO(HARD.kr));
    st.rows.forEach(rw=>rw.s.forEach(x=>L2.push(TH(x.t,true))));
    speak(L2);
  };
  const okNoMic=()=>{
    const said=st.who==='me'?st.rows.map(r=>txt(r.s)).join(' / '):st.rows.map(r=>txt(r.s)).join(' · ');
    addMe(`<div class="th" style="font-size:20px">${esc(said)}</div><div style="font-size:14px;color:#7a5a2a">(따라 말했어요)</div>`);
    const p=PRAISE_REPEAT[Math.floor(Math.random()*PRAISE_REPEAT.length)];
    addFriend(p);
    micCtx=null;
    nextBar(null);
  };
  ctx.redraw=()=>{
    if(micCtx!==ctx)return;
    const mic=DICT&&!micOff;
    bar(`<div class="grid">
      <button class="btn" id="pa">▶ 전체 듣기<small>보통 속도로</small></button>
      <button class="btn" id="ps">🐢 한 글자씩<small>더 천천히</small></button>
      ${mic?`<button class="btn mic" id="mic"></button>`
           :`<button class="btn" id="hd">어려워요<small><span class="th">ยากจัง</span></small></button>`}
      ${mic?(ctx.graded?`<button class="btn pri" id="nx2"><span class="th">ต่อไป</span> · 다음 ▶<small>다음으로</small></button>`
                       :`<button class="btn" id="ok">채점 없이 넘어가기<small>따라 했어요</small></button>`)
           :`<button class="btn pri" id="ok">따라 했어요 ✓<small><span class="th">พูดตามแล้ว</span></small></button>`}
      </div><div class="live hidden" id="live"></div>`);
    $('pa').onclick=playAll;$('ps').onclick=playSyl;
    if($('hd'))$('hd').onclick=hard;
    if($('ok'))$('ok').onclick=okNoMic;
    if($('nx2'))$('nx2').onclick=next;
    if($('mic')){$('mic').onclick=micClick;drawMic(DICT.active()?'listening':'idle')}
  };
  ctx.redraw();
}

function doQuiz(st){
  const isTone=st.type==='tone';
  const q=isTone?TONE_Q:MEAN_Q;
  const word=txt(st.word);
  addFriend(q,null,{});
  const lg=$('log');
  const card=el('div','listen');
  card.innerHTML=`<div class="q th">?</div><button class="big">🔊 다시 듣기 · <span class="th">ฟังอีกที</span></button>`;
  const qMark=card.querySelector('.q');
  card.querySelector('.big').onclick=()=>speak([TH(word)]);
  lg.appendChild(card);scrollEnd();
  // speak question then the word
  const LQ=[];
  if(set.auto==='on'){if(set.mode==='kr')LQ.push(KO(q.kr));else LQ.push(TH(q.th));}
  LQ.push(TH(word));LQ.push(TH(word,true));
  speak(LQ);

  const opts=isTone?TN.map((t,i)=>({h:`<span style="color:var(${t.c});font-weight:700">${t.ko}</span> <span class="th">${t.th}</span>`,i}))
                   :st.options.map((o,i)=>({h:esc(o),i}));
  bar(`<div class="grid ${isTone?'':(opts.length===3?'one':'')}">${opts.map(o=>`<button class="btn opt" data-i="${o.i}">${o.h}</button>`).join('')}
     ${isTone?'<button class="btn" id="qa">🔊 다시</button>':''}</div>`);
  if($('qa'))$('qa').onclick=()=>speak([TH(word)]);
  L.total++;
  let tries=0;
  $('bar').querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    const pickI=+b.dataset.i;tries++;
    if(pickI===st.ans){
      b.classList.add('ok');
      if(tries===1)L.score++;
      qMark.outerHTML=`<div class="chips" style="justify-content:center">${st.word.map(chipHTML).join('')}</div>`;
      card.querySelectorAll('.chip').forEach(c=>c.onclick=()=>speak([TH(c.dataset.t,true)]));
      const p=PRAISE_QUIZ[Math.floor(Math.random()*PRAISE_QUIZ.length)];
      const ansTxt=isTone?`${word} = ${TN[st.ans].ko} (${TN[st.ans].th})${st.mean?' · 뜻: '+st.mean:''}`:`${word} = ${st.options[st.ans]}`;
      addFriend(p,`<div class="ans th">${esc(ansTxt)}</div>`);
      nextBar(null);
    }else{
      b.classList.add('bad');b.disabled=true;
      addFriend(WRONG,null,{});
      speak([...(set.auto==='on'&&set.mode==='kr'?[KO(WRONG.kr)]:set.auto==='on'?[TH(WRONG.th)]:[]),TH(word,true)]);
    }
  });
}

function finish(){
  const d=L.day;
  const pavg=L.pron.length?Math.round(L.pron.reduce((a,b)=>a+b,0)/L.pron.length):null;
  const qtxt=(L.total?`퀴즈 ${L.score}/${L.total}`:'')+(pavg!=null?` · 발음 ${pavg}점`:'');
  done[d.id]={q:qtxt,at:Date.now()};save();
  const box=el('div','end',`${avatar(64)}<h3>DAY ${L.di+1} 끝! <span class="th">เก่งมาก</span></h3>
    <div>${L.total?'한 번에 맞힌 퀴즈: <b>'+L.score+' / '+L.total+'</b>':''}</div>
    ${pavg!=null?`<div>발음 평균 점수: <b>${pavg}점</b> (${L.pron.length}번 채점)</div>`:''}
    <div style="color:var(--sub);font-size:15px;margin-top:6px">내일 또 하면 더 잘 들려요.</div>`);
  $('log').appendChild(box);scrollEnd();
  const hasNext=L.di+1<DAYS.length;
  bar(`<div class="grid ${hasNext?'three':''}">
    <button class="btn" id="again2">다시 하기</button>
    <button class="btn" id="home2">처음 화면</button>
    ${hasNext?`<button class="btn pri" id="nextDay">DAY ${L.di+2} ▶</button>`:''}</div>`);
  $('again2').onclick=()=>startDay(L.di);
  $('home2').onclick=goHome;
  if(hasNext)$('nextDay').onclick=()=>startDay(L.di+1);
}

renderHome();
if(!NATIVE)setTimeout(checkVoice,1200);
setTimeout(updDiag,1500);
initDict();
(function initTTS(){
  if(NATIVE){ttsChecked=true;return}
  let p=null;
  try{if(window.claude&&typeof claude.use==='function')p=claude.use('tts')}catch(e){}
  if(!p){ttsChecked=true;updDiag();return}
  p.then(t=>{TTS=t||null;ttsChecked=true;updDiag()}).catch(()=>{ttsChecked=true;updDiag()});
})();
</script>
